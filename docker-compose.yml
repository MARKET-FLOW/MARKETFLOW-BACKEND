services:
  # Database service
  db:
    image: postgres:15-alpine
    deploy:
      resources:
        limits:
          memory: 256M
    container_name: marketflow_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: unless-stopped
    ports:
      - '${DB_OUTPUT_PORT}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: ${START_PERIOD:-30}s

  # Redis service
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 128M
    container_name: marketflow_redis
    ports:
      - '${REDIS_PORT}:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 2G
    container_name: marketflow_api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DB_TYPE}://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      API_PORT: ${API_PORT:-3000}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 50s
    ports:
      - '${API_PORT}:3000'
      - '5555:5555'
    volumes:
      - .:/app:delegated
      - /app/node_modules
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
